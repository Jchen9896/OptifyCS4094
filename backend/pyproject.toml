[project]
name = "optify-backend"
version = "0.1.0"
description = "Optify FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.61",
    "pytest>=8.3.0",
    "pydantic>=2.7",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=43.0.0",
    "numpy>=2.0",
    "cvxpy>=1.5",
    "google-genai>=1.0.0",
    "pgvector>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.chat" = ["corpus/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
